<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Live Leaderboard - PC Detective
    </title>

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            padding: 20px;

            background:
                #0f172a;

            color:
                #f8fafc;

            font-family:
                'Noto Sans Thai',
                sans-serif;
        }


        .header {

            text-align:
                center;

            margin-bottom:
                30px;
        }


        h1 {

            margin:
                0 0 6px;

            color:
                #3b82f6;

            font-size:
                clamp(
                    1.8rem,
                    4vw,
                    2.7rem
                );
        }


        .header p {

            margin: 0;

            color:
                #cbd5e1;
        }


        .btn-clear {

            position:
                absolute;

            top: 20px;

            right: 20px;

            border: none;

            border-radius:
                8px;

            padding:
                10px 18px;

            background:
                #ef4444;

            color:
                white;

            font-weight:
                bold;

            cursor:
                pointer;
        }


        .table-container {

            width:
                100%;

            overflow-x:
                auto;
        }


        table {

            width:
                100%;

            max-width:
                1150px;

            margin:
                0 auto;

            border-collapse:
                collapse;

            overflow:
                hidden;

            border-radius:
                12px;

            background:
                #1e293b;

            box-shadow:
                0 4px 10px
                rgba(
                    0,
                    0,
                    0,
                    .3
                );
        }


        th,
        td {

            padding:
                15px;

            text-align:
                center;

            border-bottom:
                1px solid
                #334155;

            font-size:
                16px;
        }


        th {

            background:
                #3b82f6;

            color:
                white;

            font-size:
                17px;
        }


        tr:nth-child(
            even
        ) {

            background:
                #0f172a;
        }


        .rank-icon {

            margin-right:
                5px;

            font-size:
                21px;
        }


        .accuracy-good {

            color:
                #10b981;

            font-weight:
                bold;
        }


        .accuracy-medium {

            color:
                #f59e0b;

            font-weight:
                bold;
        }


        .accuracy-bad {

            color:
                #ef4444;

            font-weight:
                bold;
        }


        .loading {

            color:
                #94a3b8;
        }


        .error-message {

            color:
                #ef4444;

            padding:
                25px;
        }


        .hidden {

            display:
                none !important;
        }


        .modal-overlay {

            position:
                fixed;

            inset: 0;

            z-index:
                1000;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                20px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    .85
                );

            backdrop-filter:
                blur(
                    3px
                );
        }


        .modal-card {

            width:
                min(
                    360px,
                    100%
                );

            padding:
                25px;

            border-radius:
                12px;

            border-top:
                4px solid
                #ef4444;

            background:
                #1e293b;

            text-align:
                center;
        }


        .modal-title {

            margin-bottom:
                10px;

            color:
                #ef4444;

            font-size:
                20px;

            font-weight:
                bold;
        }


        .modal-description {

            margin-bottom:
                20px;

            color:
                #cbd5e1;

            font-size:
                14px;
        }


        .input-group {

            margin-bottom:
                15px;

            text-align:
                left;
        }


        .input-group label {

            display:
                block;

            margin-bottom:
                5px;

            color:
                #94a3b8;
        }


        .input-group input {

            width:
                100%;

            padding:
                10px;

            border:
                1px solid
                #334155;

            border-radius:
                6px;

            background:
                #0f172a;

            color:
                white;

            outline:
                none;
        }


        .modal-buttons {

            display:
                flex;

            gap:
                10px;
        }


        .modal-buttons button {

            flex: 1;

            padding:
                10px;

            border:
                none;

            border-radius:
                6px;

            color:
                white;

            cursor:
                pointer;
        }


        .btn-cancel {

            background:
                #64748b;
        }


        .btn-confirm {

            background:
                #ef4444;
        }


        @media (
            max-width: 800px
        ) {

            .btn-clear {

                position:
                    static;

                display:
                    block;

                margin:
                    0 0 20px
                    auto;
            }


            th,
            td {

                white-space:
                    nowrap;

                font-size:
                    14px;

                padding:
                    12px 9px;
            }
        }

    </style>

</head>


<body>


<button
    class="btn-clear"
    onclick="openAdminModal()"
>
    🗑️ ล้างคะแนนเริ่มคาบใหม่
</button>


<div
    class="header"
>

    <h1>
        🏆 LIVE LEADERBOARD
    </h1>

    <p>
        ตารางอันดับช่างซ่อมคอมพิวเตอร์ประจำคาบเรียน
        (Real-time)
    </p>

</div>


<div
    class="table-container"
>

<table>

<thead>

<tr>

    <th>
        อันดับ
    </th>

    <th>
        ชื่อร้านค้า / นักเรียน
    </th>

    <th>
        Rank
    </th>

    <th>
        ดาว ⭐
    </th>

    <th>
        Accuracy 🎯
    </th>

    <th>
        เงิน 💰
    </th>

</tr>

</thead>


<tbody
    id="leaderboard-body"
>

<tr>

<td
    colspan="6"
    class="loading"
>

    ⏳ กำลังเชื่อมต่อ Firebase...

</td>

</tr>

</tbody>

</table>

</div>


<div
    id="admin-modal"
    class="modal-overlay hidden"
>

<div
    class="modal-card"
>

<div
    class="modal-title"
>

    🔒 ยืนยันตัวตนผู้สอน

</div>


<div
    class="modal-description"
>

    กรุณาเข้าสู่ระบบ
    เพื่อล้างกระดานคะแนน

</div>


<div
    class="input-group"
>

<label>
    📧 อีเมล
</label>

<input
    type="email"
    id="admin-email"
    autocomplete="username"
>

</div>


<div
    class="input-group"
>

<label>
    🔑 รหัสผ่าน
</label>

<input
    type="password"
    id="admin-password"
    autocomplete="current-password"
>

</div>


<div
    class="modal-buttons"
>

<button
    class="btn-cancel"
    onclick="closeAdminModal()"
>

    ยกเลิก

</button>


<button
    class="btn-confirm"
    onclick="confirmClearBoard()"
>

    ล้างกระดาน

</button>

</div>

</div>

</div>


<script
    src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"
></script>

<script
    src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"
></script>

<script
    src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"
></script>

<script
    src="firebase-config.js"
></script>


<script>


function escapeHTML(
    value
) {

    return String(
        value
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );
}


// ===============================
// Rank
// ===============================

function getRankDisplay(
    stars
) {

    stars =
        Number(
            stars
        ) || 0;


    if (
        stars >= 50
    ) {

        return `
            <span class="rank-icon">
                👑
            </span>
            Conqueror
        `;
    }


    if (
        stars >= 30
    ) {

        return `
            <span class="rank-icon">
                💎
            </span>
            Diamond
        `;
    }


    if (
        stars >= 20
    ) {

        return `
            <span class="rank-icon">
                🔮
            </span>
            Platinum
        `;
    }


    if (
        stars >= 15
    ) {

        return `
            <span class="rank-icon">
                🥇
            </span>
            Gold
        `;
    }


    if (
        stars >= 10
    ) {

        return `
            <span class="rank-icon">
                🥈
            </span>
            Silver
        `;
    }


    return `
        <span class="rank-icon">
            🥉
        </span>
        Bronze
    `;
}


// ===============================
// Accuracy
// ===============================

function getAccuracyHTML(
    accuracy,
    totalAttempts
) {

    accuracy =
        Number(
            accuracy
        ) || 0;


    totalAttempts =
        Number(
            totalAttempts
        ) || 0;


    if (
        totalAttempts ===
        0
    ) {

        return `
            <span
                style="
                    color:#94a3b8;
                "
            >
                -
            </span>
        `;
    }


    let className =
        "accuracy-bad";


    if (
        accuracy >=
        80
    ) {

        className =
            "accuracy-good";

    } else if (
        accuracy >=
        60
    ) {

        className =
            "accuracy-medium";
    }


    return `
        <span
            class="${className}"
        >
            ${accuracy}%
        </span>
    `;
}


// ===============================
// Error
// ===============================

function showBoardError(
    message
) {

    document
        .getElementById(
            "leaderboard-body"
        )
        .innerHTML = `

        <tr>

            <td
                colspan="6"
                class="error-message"
            >

                ❌
                ${escapeHTML(
                    message
                )}

            </td>

        </tr>

    `;
}


// ===============================
// Leaderboard
// ===============================

function startLeaderboard() {

    const tbody =
        document
            .getElementById(
                "leaderboard-body"
            );


    db
        .ref(
            "leaderboard"
        )

        .on(

            "value",

            snapshot => {

                if (
                    !snapshot.exists()
                ) {

                    tbody.innerHTML = `

                        <tr>

                            <td
                                colspan="6"
                            >

                                ยังไม่มีนักเรียน
                                เริ่มเล่นในคาบนี้

                            </td>

                        </tr>

                    `;

                    return;
                }


                const players =
                    [];


                snapshot.forEach(
                    child => {

                        const data =
                            child.val() ||
                            {};


                        players.push({

                            shopName:
                                data.shopName ||
                                "ไม่ระบุชื่อ",

                            stars:
                                Number(
                                    data.stars
                                ) || 0,

                            gold:
                                Number(
                                    data.gold
                                ) || 0,

                            accuracy:
                                Number(
                                    data.accuracy
                                ) || 0,

                            totalAttempts:
                                Number(
                                    data.totalAttempts
                                ) || 0,

                            correctAttempts:
                                Number(
                                    data.correctAttempts
                                ) || 0
                        });
                    }
                );


                // ดาวมากก่อน
                // ถ้าดาวเท่ากัน Accuracy มากก่อน
                // ถ้ายังเท่ากัน เงินมากก่อน

                players.sort(
                    (
                        a,
                        b
                    ) => {

                        if (
                            b.stars !==
                            a.stars
                        ) {

                            return (
                                b.stars -
                                a.stars
                            );
                        }


                        if (
                            b.accuracy !==
                            a.accuracy
                        ) {

                            return (
                                b.accuracy -
                                a.accuracy
                            );
                        }


                        return (
                            b.gold -
                            a.gold
                        );
                    }
                );


                tbody.innerHTML =
                    "";


                players.forEach(
                    (
                        player,
                        index
                    ) => {

                        let position =
                            index + 1;


                        if (
                            index ===
                            0
                        ) {

                            position =
                                "🥇 1";

                        } else if (
                            index ===
                            1
                        ) {

                            position =
                                "🥈 2";

                        } else if (
                            index ===
                            2
                        ) {

                            position =
                                "🥉 3";
                        }


                        const row =
                            document
                                .createElement(
                                    "tr"
                                );


                        row.innerHTML = `

                            <td>
                                <b>
                                    ${position}
                                </b>
                            </td>

                            <td>
                                <b>
                                    ${escapeHTML(
                                        player.shopName
                                    )}
                                </b>
                            </td>

                            <td>
                                ${getRankDisplay(
                                    player.stars
                                )}
                            </td>

                            <td
                                style="
                                    color:#f59e0b;
                                "
                            >
                                <b>
                                    ${player.stars}
                                    ⭐
                                </b>
                            </td>

                            <td>

                                ${getAccuracyHTML(
                                    player.accuracy,
                                    player.totalAttempts
                                )}

                                <div
                                    style="
                                        margin-top:3px;
                                        color:#64748b;
                                        font-size:10px;
                                    "
                                >

                                    ${player.correctAttempts}
                                    /
                                    ${player.totalAttempts}

                                </div>

                            </td>

                            <td
                                style="
                                    color:#10b981;
                                "
                            >

                                <b>
                                    $${player.gold}
                                </b>

                            </td>

                        `;


                        tbody.appendChild(
                            row
                        );
                    }
                );
            },


            error => {

                console.error(
                    error
                );


                showBoardError(
                    "โหลดข้อมูลไม่ได้: " +
                    error.message
                );
            }
        );
}


// ===============================
// Boot
// ===============================

async function bootLeaderboard() {

    try {

        await
            ensureAnonymousAuth();


        startLeaderboard();

    } catch (
        error
    ) {

        showBoardError(
            "Authentication Error: " +
            error.message
        );
    }
}


// ===============================
// Admin
// ===============================

function openAdminModal() {

    document
        .getElementById(
            "admin-modal"
        )
        .classList
        .remove(
            "hidden"
        );
}


function closeAdminModal() {

    document
        .getElementById(
            "admin-modal"
        )
        .classList
        .add(
            "hidden"
        );
}


async function confirmClearBoard() {

    const email =
        document
            .getElementById(
                "admin-email"
            )
            .value
            .trim();


    const password =
        document
            .getElementById(
                "admin-password"
            )
            .value;


    if (
        !email ||
        !password
    ) {

        alert(
            "กรุณากรอกอีเมลและรหัสผ่าน"
        );

        return;
    }


    closeAdminModal();


    try {

        await auth
            .signInWithEmailAndPassword(
                email,
                password
            );


        await db
            .ref(
                "leaderboard"
            )
            .remove();


        alert(
            "✅ ล้างกระดานเรียบร้อย"
        );


        await
            auth.signOut();


        await
            ensureAnonymousAuth();

    } catch (
        error
    ) {

        console.error(
            error
        );


        alert(
            "❌ ล้างกระดานไม่สำเร็จ\n\n" +
            error.message
        );


        try {

            await
                auth.signOut();

        } catch (
            e
        ) {}


        try {

            await
                ensureAnonymousAuth();

        } catch (
            e
        ) {}
    }
}


document
    .getElementById(
        "admin-password"
    )
    .addEventListener(

        "keydown",

        event => {

            if (
                event.key ===
                "Enter"
            ) {

                confirmClearBoard();
            }
        }
    );


bootLeaderboard();


</script>


</body>

</html>
