<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live Leaderboard - PC Detective</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;

            background: #0f172a;
            color: #f8fafc;

            font-family: 'Noto Sans Thai', sans-serif;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0 0 6px;

            color: #3b82f6;

            font-size: clamp(
                1.8rem,
                4vw,
                2.7rem
            );
        }

        .header p {
            margin: 0;
            color: #cbd5e1;
        }

        .btn-clear {
            position: absolute;

            top: 20px;
            right: 20px;

            border: none;

            border-radius: 8px;

            padding: 10px 18px;

            background: #ef4444;
            color: white;

            font-weight: bold;
            font-size: 15px;

            cursor: pointer;
        }

        .btn-clear:hover {
            background: #dc2626;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            max-width: 1000px;

            margin: 0 auto;

            border-collapse: collapse;

            overflow: hidden;

            border-radius: 12px;

            background: #1e293b;

            box-shadow:
                0 4px 10px
                rgba(0, 0, 0, 0.3);
        }

        th,
        td {
            padding: 15px;

            text-align: center;

            border-bottom:
                1px solid #334155;

            font-size: 17px;
        }

        th {
            background: #3b82f6;
            color: white;

            font-size: 18px;
        }

        tr:nth-child(even) {
            background: #0f172a;
        }

        .rank-icon {
            font-size: 22px;
            margin-right: 5px;
        }

        .loading {
            color: #94a3b8;
        }

        .error-message {
            padding: 25px;
            color: #ef4444;
        }

        .hidden {
            display: none !important;
        }

        /* =========================
           ADMIN MODAL
        ========================= */

        .modal-overlay {
            position: fixed;

            inset: 0;

            z-index: 1000;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                rgba(0, 0, 0, 0.85);

            backdrop-filter:
                blur(3px);
        }

        .modal-card {
            width: min(
                360px,
                100%
            );

            padding: 25px;

            border-radius: 12px;

            border-top:
                4px solid #ef4444;

            background:
                #1e293b;

            text-align: center;

            box-shadow:
                0 10px 25px
                rgba(0, 0, 0, 0.5);
        }

        .modal-title {
            margin-bottom: 10px;

            color: #ef4444;

            font-size: 20px;
            font-weight: bold;
        }

        .modal-description {
            margin-bottom: 20px;

            color: #cbd5e1;

            font-size: 14px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;

            margin-bottom: 5px;

            color: #94a3b8;

            font-size: 14px;
        }

        .input-group input {
            width: 100%;

            padding: 10px;

            border:
                1px solid #334155;

            border-radius: 6px;

            outline: none;

            background:
                #0f172a;

            color:
                #f8fafc;

            font-size: 16px;
        }

        .input-group input:focus {
            border-color:
                #3b82f6;
        }

        .modal-buttons {
            display: flex;

            gap: 10px;

            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;

            border: none;

            border-radius: 6px;

            padding: 10px;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        .btn-cancel {
            background:
                #64748b;
        }

        .btn-confirm {
            background:
                #ef4444;

            font-weight: bold;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (
            max-width: 800px
        ) {

            body {
                padding: 15px;
            }

            .btn-clear {
                position: static;

                display: block;

                margin:
                    0 0 20px auto;
            }

            th,
            td {
                padding:
                    12px 10px;

                font-size:
                    15px;

                white-space:
                    nowrap;
            }
        }

        @media (
            max-width: 480px
        ) {

            body {
                padding: 10px;
            }

            .btn-clear {
                width: 100%;
            }

            .header p {
                font-size: 13px;
            }

            th,
            td {
                padding:
                    10px 8px;

                font-size:
                    13px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         ปุ่มล้างคะแนน
    ========================== -->

    <button
        class="btn-clear"
        onclick="openAdminModal()"
    >
        🗑️ ล้างคะแนนเริ่มคาบใหม่
    </button>


    <!-- =========================
         Header
    ========================== -->

    <div class="header">

        <h1>
            🏆 LIVE LEADERBOARD
        </h1>

        <p>
            ตารางอันดับช่างซ่อมคอมพิวเตอร์ประจำคาบเรียน
            (Real-time)
        </p>

    </div>


    <!-- =========================
         Leaderboard
    ========================== -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>
                        อันดับ
                    </th>

                    <th>
                        ชื่อร้านค้า / นักเรียน
                    </th>

                    <th>
                        Rank ปัจจุบัน
                    </th>

                    <th>
                        จำนวนดาว (⭐)
                    </th>

                    <th>
                        เงินสะสม (💰)
                    </th>

                </tr>

            </thead>


            <tbody
                id="leaderboard-body"
            >

                <tr>

                    <td
                        colspan="5"
                        class="loading"
                    >
                        ⏳ กำลังเชื่อมต่อ Firebase...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <!-- =========================
         Admin Login Modal
    ========================== -->

    <div
        id="admin-modal"
        class="modal-overlay hidden"
    >

        <div
            class="modal-card"
        >

            <div
                class="modal-title"
            >
                🔒 ยืนยันตัวตนผู้สอน
            </div>


            <div
                class="modal-description"
            >
                กรุณาเข้าสู่ระบบ
                เพื่อล้างกระดานคะแนน
            </div>


            <div
                class="input-group"
            >

                <label
                    for="admin-email"
                >
                    📧 อีเมล:
                </label>

                <input
                    type="email"
                    id="admin-email"
                    placeholder="admin@poly.ac.th"
                    autocomplete="username"
                >

            </div>


            <div
                class="input-group"
            >

                <label
                    for="admin-password"
                >
                    🔑 รหัสผ่าน:
                </label>

                <input
                    type="password"
                    id="admin-password"
                    placeholder="••••••••"
                    autocomplete="current-password"
                >

            </div>


            <div
                class="modal-buttons"
            >

                <button
                    class="btn-cancel"
                    onclick="closeAdminModal()"
                >
                    ยกเลิก
                </button>

                <button
                    class="btn-confirm"
                    onclick="confirmClearBoard()"
                >
                    ล้างกระดาน
                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         Firebase SDK
    ========================== -->

    <script
        src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"
    ></script>

    <script
        src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"
    ></script>

    <script
        src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"
    ></script>

    <script
        src="firebase-config.js"
    ></script>


    <script>

        /* ==========================================
           Rank
           
           Bronze      0 - 9
           Silver     10 - 14
           Gold       15 - 19
           Platinum   20 - 29
           Diamond    30 - 49
           Conqueror  50+
        ========================================== */

        function getRankDisplay(
            stars
        ) {

            stars =
                Number(
                    stars
                ) || 0;


            if (
                stars >= 50
            ) {

                return `
                    <span
                        class="rank-icon"
                    >
                        👑
                    </span>
                    Conqueror
                `;
            }


            if (
                stars >= 30
            ) {

                return `
                    <span
                        class="rank-icon"
                    >
                        💎
                    </span>
                    Diamond
                `;
            }


            if (
                stars >= 20
            ) {

                return `
                    <span
                        class="rank-icon"
                    >
                        🔮
                    </span>
                    Platinum
                `;
            }


            if (
                stars >= 15
            ) {

                return `
                    <span
                        class="rank-icon"
                    >
                        🥇
                    </span>
                    Gold
                `;
            }


            if (
                stars >= 10
            ) {

                return `
                    <span
                        class="rank-icon"
                    >
                        🥈
                    </span>
                    Silver
                `;
            }


            return `
                <span
                    class="rank-icon"
                >
                    🥉
                </span>
                Bronze
            `;
        }


        /* ==========================================
           ป้องกัน HTML Injection
        ========================================== */

        function escapeHTML(
            value
        ) {

            return String(
                value
            )

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );
        }


        /* ==========================================
           แสดง Error
        ========================================== */

        function showBoardError(
            message
        ) {

            const tbody =
                document
                    .getElementById(
                        "leaderboard-body"
                    );


            tbody.innerHTML = `

                <tr>

                    <td
                        colspan="5"
                        class="error-message"
                    >

                        ❌
                        ${escapeHTML(
                            message
                        )}

                    </td>

                </tr>

            `;
        }


        /* ==========================================
           โหลด Leaderboard
        ========================================== */

        function startLeaderboard() {

            const tbody =
                document
                    .getElementById(
                        "leaderboard-body"
                    );


            if (
                typeof db ===
                "undefined"
            ) {

                showBoardError(
                    "ไม่พบการเชื่อมต่อฐานข้อมูล กรุณาตรวจสอบ firebase-config.js"
                );

                return;
            }


            db
                .ref(
                    "leaderboard"
                )
                .on(

                    "value",

                    function(
                        snapshot
                    ) {

                        /*
                        ไม่มีผู้เล่น
                        */

                        if (
                            !snapshot.exists()
                        ) {

                            tbody.innerHTML = `

                                <tr>

                                    <td
                                        colspan="5"
                                    >

                                        ยังไม่มีนักเรียน
                                        เปิดร้านซ่อมคอม
                                        ในคาบนี้...

                                    </td>

                                </tr>

                            `;

                            return;
                        }


                        /*
                        แปลง Firebase
                        Object เป็น Array
                        */

                        const players =
                            [];


                        snapshot
                            .forEach(

                                function(
                                    childSnapshot
                                ) {

                                    const data =
                                        childSnapshot
                                            .val()
                                        || {};


                                    players.push({

                                        uid:
                                            childSnapshot.key,

                                        shopName:
                                            data.shopName
                                            ||
                                            "ไม่ระบุชื่อ",

                                        stars:
                                            Number(
                                                data.stars
                                            ) || 0,

                                        gold:
                                            Number(
                                                data.gold
                                            ) || 0

                                    });

                                }

                            );


                        /*
                        เรียงอันดับ

                        1. ดาวมากกว่า
                        2. ถ้าดาวเท่ากัน
                           เงินมากกว่า
                        */

                        players.sort(

                            function(
                                a,
                                b
                            ) {

                                if (
                                    b.stars
                                    !==
                                    a.stars
                                ) {

                                    return (
                                        b.stars
                                        -
                                        a.stars
                                    );
                                }


                                return (
                                    b.gold
                                    -
                                    a.gold
                                );
                            }

                        );


                        tbody.innerHTML =
                            "";


                        /*
                        สร้างแถว
                        */

                        players.forEach(

                            function(
                                player,
                                index
                            ) {

                                let position =
                                    index + 1;


                                if (
                                    index === 0
                                ) {

                                    position =
                                        "🥇 1";
                                }

                                else if (
                                    index === 1
                                ) {

                                    position =
                                        "🥈 2";
                                }

                                else if (
                                    index === 2
                                ) {

                                    position =
                                        "🥉 3";
                                }


                                const tr =
                                    document
                                        .createElement(
                                            "tr"
                                        );


                                tr.innerHTML = `

                                    <td>

                                        <b>
                                            ${position}
                                        </b>

                                    </td>


                                    <td>

                                        <b>

                                            ${escapeHTML(
                                                player.shopName
                                            )}

                                        </b>

                                    </td>


                                    <td>

                                        ${getRankDisplay(
                                            player.stars
                                        )}

                                    </td>


                                    <td
                                        style="
                                            color:#f59e0b;
                                        "
                                    >

                                        <b>

                                            ${player.stars}
                                            ⭐

                                        </b>

                                    </td>


                                    <td
                                        style="
                                            color:#10b981;
                                        "
                                    >

                                        <b>

                                            $${player.gold}

                                        </b>

                                    </td>

                                `;


                                tbody.appendChild(
                                    tr
                                );
                            }

                        );

                    },


                    /*
                    Firebase Error
                    */

                    function(
                        error
                    ) {

                        console.error(
                            "Leaderboard Firebase Error:",
                            error
                        );


                        showBoardError(

                            "โหลดข้อมูลไม่ได้: "
                            +
                            error.message

                        );
                    }

                );
        }


        /* ==========================================
           รอ Firebase Authentication
           ก่อนโหลด Leaderboard
        ========================================== */

        async function bootLeaderboard() {

            try {

                if (
                    typeof ensureAnonymousAuth
                    !==
                    "function"
                ) {

                    throw new Error(
                        "ไม่พบ ensureAnonymousAuth() ใน firebase-config.js"
                    );
                }


                await
                    ensureAnonymousAuth();


                console.log(
                    "Leaderboard authenticated"
                );


                startLeaderboard();

            }

            catch (
                error
            ) {

                console.error(
                    "Leaderboard auth error:",
                    error
                );


                showBoardError(

                    "เชื่อมต่อระบบผู้ใช้ไม่ได้: "
                    +
                    error.message

                );
            }
        }


        /* ==========================================
           เปิด Admin Modal
        ========================================== */

        function openAdminModal() {

            document
                .getElementById(
                    "admin-modal"
                )
                .classList
                .remove(
                    "hidden"
                );


            document
                .getElementById(
                    "admin-email"
                )
                .value =
                "";


            document
                .getElementById(
                    "admin-password"
                )
                .value =
                "";


            setTimeout(

                function() {

                    document
                        .getElementById(
                            "admin-email"
                        )
                        .focus();

                },

                100

            );
        }


        /* ==========================================
           ปิด Admin Modal
        ========================================== */

        function closeAdminModal() {

            document
                .getElementById(
                    "admin-modal"
                )
                .classList
                .add(
                    "hidden"
                );
        }


        /* ==========================================
           ล้าง Leaderboard
        ========================================== */

        async function confirmClearBoard() {

            const adminEmail =
                document
                    .getElementById(
                        "admin-email"
                    )
                    .value
                    .trim();


            const adminPassword =
                document
                    .getElementById(
                        "admin-password"
                    )
                    .value;


            if (
                !adminEmail
                ||
                !adminPassword
            ) {

                alert(
                    "⚠️ กรุณากรอกอีเมลและรหัสผ่านให้ครบถ้วน!"
                );

                return;
            }


            closeAdminModal();


            try {

                /*
                Login ผู้สอน
                */

                await auth
                    .signInWithEmailAndPassword(

                        adminEmail,
                        adminPassword

                    );


                /*
                ล้าง Leaderboard
                */

                await db
                    .ref(
                        "leaderboard"
                    )
                    .remove();


                alert(
                    "✅ ล้างข้อมูลกระดานเรียบร้อย พร้อมเริ่มคาบเรียนใหม่!"
                );


                /*
                Logout Admin
                */

                await
                    auth.signOut();


                /*
                กลับเข้า Anonymous
                */

                await
                    ensureAnonymousAuth();

            }

            catch (
                error
            ) {

                console.error(
                    "Clear leaderboard error:",
                    error
                );


                alert(

                    "❌ ไม่สามารถล้างกระดานได้\n\n"
                    +
                    error.message

                );


                try {

                    await
                        auth.signOut();

                }

                catch (
                    signOutError
                ) {

                    console.error(
                        signOutError
                    );
                }


                try {

                    await
                        ensureAnonymousAuth();

                }

                catch (
                    authError
                ) {

                    console.error(
                        authError
                    );
                }
            }
        }


        /* ==========================================
           Enter = ล้างกระดาน
        ========================================== */

        document
            .getElementById(
                "admin-password"
            )
            .addEventListener(

                "keydown",

                function(
                    event
                ) {

                    if (
                        event.key ===
                        "Enter"
                    ) {

                        confirmClearBoard();
                    }
                }

            );


        /* ==========================================
           START
        ========================================== */

        bootLeaderboard();

    </script>

</body>
</html>
