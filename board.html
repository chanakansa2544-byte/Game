<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live Leaderboard - PC Detective</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Noto Sans Thai', sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #3b82f6;
            font-size: 2.5em;
            margin-bottom: 5px;
        }

        .header p {
            color: #cbd5e1;
        }

        .btn-clear {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .btn-clear:hover {
            background-color: #dc2626;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        th,
        td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #334155;
            font-size: 18px;
        }

        th {
            background-color: #3b82f6;
            color: white;
            font-size: 20px;
        }

        tr:nth-child(even) {
            background-color: #0f172a;
        }

        .rank-icon {
            font-size: 24px;
            margin-right: 5px;
        }

        .loading {
            color: #94a3b8;
        }

        .error-message {
            color: #ef4444;
            padding: 25px;
        }

        .hidden {
            display: none !important;
        }

        /* =========================
           Admin Modal
        ========================= */

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            z-index: 1000;

            backdrop-filter: blur(3px);

            padding: 20px;
        }

        .modal-card {
            background: #1e293b;

            padding: 25px;

            border-radius: 12px;

            text-align: center;

            max-width: 350px;
            width: 100%;

            box-shadow: 0 10px 25px rgba(0,0,0,0.5);

            border-top: 4px solid #ef4444;
        }

        .modal-title {
            color: #ef4444;

            margin-bottom: 10px;

            font-size: 20px;
            font-weight: bold;
        }

        .modal-description {
            margin-bottom: 20px;
            color: #cbd5e1;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;

            color: #94a3b8;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;

            padding: 10px;

            border-radius: 6px;
            border: 1px solid #334155;

            background: #0f172a;
            color: #f8fafc;

            font-size: 16px;

            outline: none;
        }

        .input-group input:focus {
            border-color: #3b82f6;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-cancel {
            background-color: #64748b;
            color: white;

            border: none;

            padding: 10px;

            border-radius: 6px;

            cursor: pointer;

            flex: 1;

            font-size: 16px;
        }

        .btn-confirm {
            background-color: #ef4444;
            color: white;

            border: none;

            padding: 10px;

            border-radius: 6px;

            cursor: pointer;

            flex: 1;

            font-size: 16px;
            font-weight: bold;
        }

        /* =========================
           Responsive
        ========================= */

        @media (max-width: 800px) {

            body {
                padding: 15px;
            }

            .btn-clear {
                position: static;
                display: block;
                margin-left: auto;
                margin-bottom: 20px;
            }

            h1 {
                font-size: 2em;
            }

            th,
            td {
                padding: 12px 10px;
                font-size: 15px;
                white-space: nowrap;
            }

            th {
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {

            body {
                padding: 10px;
            }

            h1 {
                font-size: 1.6em;
            }

            .header p {
                font-size: 13px;
            }

            .btn-clear {
                width: 100%;
            }

            th,
            td {
                padding: 10px 8px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         ปุ่มล้างคะแนน
    ========================== -->

    <button
        class="btn-clear"
        onclick="openAdminModal()"
    >
        🗑️ ล้างคะแนนเริ่มคาบใหม่
    </button>


    <!-- =========================
         Header
    ========================== -->

    <div class="header">

        <h1>🏆 LIVE LEADERBOARD</h1>

        <p>
            ตารางอันดับช่างซ่อมคอมพิวเตอร์ประจำคาบเรียน
            (Real-time)
        </p>

    </div>


    <!-- =========================
         Leaderboard
    ========================== -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>อันดับ</th>

                    <th>
                        ชื่อร้านค้า / นักเรียน
                    </th>

                    <th>
                        Rank ปัจจุบัน
                    </th>

                    <th>
                        จำนวนดาว (⭐)
                    </th>

                    <th>
                        เงินสะสม (💰)
                    </th>

                </tr>

            </thead>


            <tbody id="leaderboard-body">

                <tr>

                    <td
                        colspan="5"
                        class="loading"
                    >
                        ⏳ กำลังเชื่อมต่อ Firebase...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <!-- =========================
         Admin Login Modal
    ========================== -->

    <div
        id="admin-modal"
        class="modal-overlay hidden"
    >

        <div class="modal-card">

            <div class="modal-title">
                🔒 ยืนยันตัวตนผู้สอน
            </div>


            <div class="modal-description">

                กรุณาเข้าสู่ระบบเพื่อล้างกระดานคะแนน

            </div>


            <div class="input-group">

                <label>
                    📧 อีเมล:
                </label>

                <input
                    type="email"
                    id="admin-email"
                    placeholder="admin@poly.ac.th"
                    autocomplete="username"
                >

            </div>


            <div class="input-group">

                <label>
                    🔑 รหัสผ่าน:
                </label>

                <input
                    type="password"
                    id="admin-password"
                    placeholder="••••••••"
                    autocomplete="current-password"
                >

            </div>


            <div class="modal-buttons">

                <button
                    class="btn-cancel"
                    onclick="closeAdminModal()"
                >
                    ยกเลิก
                </button>


                <button
                    class="btn-confirm"
                    onclick="confirmClearBoard()"
                >
                    ล้างกระดาน
                </button>

            </div>

        </div>

    </div>



    <!-- =========================
         Firebase SDK
    ========================== -->

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>


    <!--
        firebase-config.js ต้องมี:
        const db = firebase.database();
        const auth = firebase.auth();
    -->

    <script src="firebase-config.js"></script>



    <script>

        /* ==========================================
           Rank
        ========================================== */

        function getRankDisplay(stars) {

            stars = Number(stars) || 0;

            if (stars >= 50) {

                return `
                    <span class="rank-icon">👑</span>
                    Conqueror
                `;

            }

            if (stars >= 30) {

                return `
                    <span class="rank-icon">💎</span>
                    Diamond
                `;

            }

            if (stars >= 20) {

                return `
                    <span class="rank-icon">🔮</span>
                    Platinum
                `;

            }

            if (stars >= 15) {

                return `
                    <span class="rank-icon">🥇</span>
                    Gold
                `;

            }

            if (stars >= 10) {

                return `
                    <span class="rank-icon">🥈</span>
                    Silver
                `;

            }

            return `
                <span class="rank-icon">🥉</span>
                Bronze
            `;
        }



        /* ==========================================
           ป้องกันข้อความ HTML จากชื่อผู้เล่น
        ========================================== */

        function escapeHTML(value) {

            return String(value)

                .replace(/&/g, "&amp;")

                .replace(/</g, "&lt;")

                .replace(/>/g, "&gt;")

                .replace(/"/g, "&quot;")

                .replace(/'/g, "&#039;");
        }



        /* ==========================================
           โหลด Leaderboard แบบ Real-time
        ========================================== */

        function startLeaderboard() {

            const tbody =
                document.getElementById(
                    'leaderboard-body'
                );


            /*
                ตรวจว่าตัวแปร db
                จาก firebase-config.js มีหรือไม่
            */

            if (
                typeof db === 'undefined'
            ) {

                console.error(
                    "Firebase database (db) is not defined"
                );

                tbody.innerHTML = `
                    <tr>
                        <td
                            colspan="5"
                            class="error-message"
                        >
                            ❌ ไม่พบการเชื่อมต่อฐานข้อมูล
                            กรุณาตรวจสอบ firebase-config.js
                        </td>
                    </tr>
                `;

                return;
            }


            /*
                อ่าน leaderboard แบบ Real-time
            */

            db.ref('leaderboard').on(

                'value',

                function(snapshot) {

                    tbody.innerHTML = '';


                    /*
                        ไม่มีข้อมูล
                    */

                    if (!snapshot.exists()) {

                        tbody.innerHTML = `
                            <tr>
                                <td colspan="5">

                                    ยังไม่มีนักเรียนเปิดร้านซ่อมคอม
                                    ในคาบนี้...

                                </td>
                            </tr>
                        `;

                        return;
                    }


                    /*
                        แปลง Firebase Object
                        เป็น Array
                    */

                    const players = [];


                    snapshot.forEach(

                        function(childSnapshot) {

                            const data =
                                childSnapshot.val() || {};


                            players.push({

                                uid:
                                    childSnapshot.key,

                                shopName:
                                    data.shopName ||
                                    'ไม่ระบุชื่อ',

                                stars:
                                    Number(
                                        data.stars
                                    ) || 0,

                                gold:
                                    Number(
                                        data.gold
                                    ) || 0

                            });

                        }

                    );


                    /*
                        เรียงอันดับ

                        1. ดาวมากกว่า
                        2. ถ้าดาวเท่ากัน เงินมากกว่า
                    */

                    players.sort(

                        function(a, b) {

                            if (
                                b.stars !== a.stars
                            ) {

                                return (
                                    b.stars -
                                    a.stars
                                );

                            }

                            return (
                                b.gold -
                                a.gold
                            );

                        }

                    );


                    /*
                        สร้างตาราง
                    */

                    players.forEach(

                        function(player, index) {

                            const tr =
                                document.createElement(
                                    'tr'
                                );


                            /*
                                อันดับ Top 3
                            */

                            let position =
                                index + 1;


                            if (index === 0) {

                                position =
                                    '🥇 1';

                            }

                            else if (
                                index === 1
                            ) {

                                position =
                                    '🥈 2';

                            }

                            else if (
                                index === 2
                            ) {

                                position =
                                    '🥉 3';

                            }


                            tr.innerHTML = `

                                <td>
                                    <b>
                                        ${position}
                                    </b>
                                </td>


                                <td>
                                    <b>
                                        ${escapeHTML(
                                            player.shopName
                                        )}
                                    </b>
                                </td>


                                <td>

                                    ${getRankDisplay(
                                        player.stars
                                    )}

                                </td>


                                <td
                                    style="
                                        color:#f59e0b;
                                    "
                                >

                                    <b>

                                        ${player.stars}
                                        ⭐

                                    </b>

                                </td>


                                <td
                                    style="
                                        color:#10b981;
                                    "
                                >

                                    <b>

                                        $${player.gold}

                                    </b>

                                </td>

                            `;


                            tbody.appendChild(tr);

                        }

                    );

                },


                /*
                    Firebase Error
                */

                function(error) {

                    console.error(
                        "Leaderboard Firebase Error:",
                        error
                    );


                    tbody.innerHTML = `

                        <tr>

                            <td
                                colspan="5"
                                class="error-message"
                            >

                                ❌ โหลดข้อมูลไม่ได้

                                <br><br>

                                ${escapeHTML(
                                    error.message
                                )}

                                <br><br>

                                <small>

                                    กรุณาตรวจสอบ
                                    Firebase Realtime Database Rules

                                </small>

                            </td>

                        </tr>

                    `;

                }

            );

        }



        /* ==========================================
           เริ่ม Leaderboard
        ========================================== */

        startLeaderboard();



        /* ==========================================
           เปิดหน้าต่าง Admin
        ========================================== */

        function openAdminModal() {

            document
                .getElementById(
                    'admin-modal'
                )
                .classList
                .remove('hidden');


            document
                .getElementById(
                    'admin-email'
                )
                .value = '';


            document
                .getElementById(
                    'admin-password'
                )
                .value = '';


            setTimeout(function() {

                document
                    .getElementById(
                        'admin-email'
                    )
                    .focus();

            }, 100);

        }



        /* ==========================================
           ปิดหน้าต่าง Admin
        ========================================== */

        function closeAdminModal() {

            document
                .getElementById(
                    'admin-modal'
                )
                .classList
                .add('hidden');

        }



        /* ==========================================
           ล้าง Leaderboard
        ========================================== */

        async function confirmClearBoard() {

            const adminEmail =
                document
                    .getElementById(
                        'admin-email'
                    )
                    .value
                    .trim();


            const adminPassword =
                document
                    .getElementById(
                        'admin-password'
                    )
                    .value;


            if (
                !adminEmail ||
                !adminPassword
            ) {

                alert(
                    "⚠️ กรุณากรอกอีเมลและรหัสผ่านให้ครบถ้วน!"
                );

                return;

            }


            closeAdminModal();


            try {

                /*
                    Login ด้วยบัญชีครู
                */

                await auth
                    .signInWithEmailAndPassword(
                        adminEmail,
                        adminPassword
                    );


                /*
                    ล้าง leaderboard
                */

                await db
                    .ref('leaderboard')
                    .remove();


                alert(
                    "✅ ล้างข้อมูลกระดานเรียบร้อย พร้อมเริ่มคาบเรียนใหม่!"
                );


                /*
                    Logout หลังทำงานเสร็จ
                */

                await auth.signOut();


                /*
                    กลับเข้าสู่ Anonymous
                    เพื่อให้ board อ่านข้อมูลต่อได้
                */

                if (
                    typeof ensureAnonymousAuth ===
                    'function'
                ) {

                    await ensureAnonymousAuth();

                }

            }

            catch(error) {

                console.error(
                    "Clear leaderboard error:",
                    error
                );


                alert(
                    "❌ ไม่สามารถล้างกระดานได้\n\n" +
                    "กรุณาตรวจสอบอีเมล รหัสผ่าน และ Firebase Rules"
                );


                try {

                    await auth.signOut();

                }

                catch(signOutError) {

                    console.error(
                        signOutError
                    );

                }


                /*
                    คืน Anonymous Session
                */

                if (
                    typeof ensureAnonymousAuth ===
                    'function'
                ) {

                    try {

                        await ensureAnonymousAuth();

                    }

                    catch(authError) {

                        console.error(
                            authError
                        );

                    }

                }

            }

        }



        /* ==========================================
           กด Enter ตอนกรอกรหัสผ่าน
        ========================================== */

        document
            .getElementById(
                'admin-password'
            )
            .addEventListener(

                'keydown',

                function(event) {

                    if (
                        event.key === 'Enter'
                    ) {

                        confirmClearBoard();

                    }

                }

            );

    </script>

</body>
</html>
